# Per-push / per-PR validation. Phase 11.C.3 — wires the three
# contributor-claimed gates from CONTRIBUTING.md as CI:
#   1. Apache-2.0 SPDX header on every Fable-packed source file
#      (`dotnet run -- AddHeaders --check`; file set auto-derived from
#      `PackagePath="fable"` fsprojs by SDK.Build.fs).
#   2. Fantomas formatting (`dotnet fantomas --check .` — the workspace
#      formatting mandate; same command contributors run locally).
#   3. DCO Signed-off-by trailer on every commit in a PR — required by
#      CONTRIBUTING.md §"Quick start" Step 4. Strict-match against the
#      commit author per the DCO spec (no anonymous / pseudonymous).
#
# Later phases added the portability gates (`fable-wire-smoke`,
# `ai-wire-conformance`, both scoped to ToolUp.AI.Wire). Phase 614 came
# for the repo's TWO REAL TEST GATES — `verify-all` (the twelve .NET
# Expecto packs) and `fable-tier` (the client-tier node:test harness) —
# which until then were local-only: nothing stopped a regression in
# either from reaching `main`, and the batch that built five new
# client-tier gates produced a red suite twice in one day, caught each
# time only by a human remembering to run it by hand.
#
# 614 landed `fable-tier` as a gate and found the .NET suite was not
# green on a Linux runner, so it shipped `verify-all` dispatch-only with
# the evidence written down rather than excluding packs or swallowing
# exits to claim a tick. Phase 617 fixed the four blockers — two of them
# defects in shipped SDK code, not test-environment noise — and
# `verify-all` now gates too. Both test gates run on every push and PR;
# the four-blocker history is kept at the `verify-all` job header
# because two of those traps can be walked into again.
#
# ─── Triggers ────────────────────────────────────────────────────────
#
# - `push` to `main` — every job except `dco`. The DCO job is
#   conditional on `pull_request`; direct-to-main signed-off discipline
#   relies on the operator's local commit-template / `format.signoff`.
# - `pull_request` against `main` — same, plus `dco`.
# - `workflow_dispatch` — the same set, on demand.
#
# Phase 614 chose `push` + `pull_request` for `fable-tier` DELIBERATELY,
# and the reasoning is recorded here because the obvious alternative
# looks cheaper and is wrong for this repo:
#
#   * `fable-tier` is one of the expensive jobs (a full Fable compile of
#     the Client tier plus 131 node:test cases). The tempting gate is
#     `pull_request` only.
#   * But this repo's normal integration path is a DIRECT PUSH to
#     `main`, not a PR — which is exactly why the `dco` job above had to
#     be marked PR-only in the first place. A PR-only test gate would
#     therefore almost never run. A gate that does not run is worse than
#     no gate: it reports green.
#   * Cost is not the constraint that would justify it. This repository
#     is public, so GitHub-hosted standard runners are free and
#     unmetered; the concurrency group below already cancels superseded
#     runs, so rapid iteration costs one run, not N. Measured: the whole
#     `fable-tier` job is ~1m35s, of which the Fable compile is 49s.
#
# Every long job carries an explicit `timeout-minutes` so a hang fails
# loudly instead of burning the 6-hour default — which is exactly how
# the `ToolUp.Cli.Tests` hang above was caught rather than missed.
#
# The concurrency group cancels superseded runs (PR force-push, branch
# updates) so CI minutes don't pile up on rapid iteration. Pattern
# borrowed from the workspace `batch IaC during debug sessions` lesson:
# `cancel-in-progress: true` is the cheap auto-cancel of stale CI.
#
# ─── Authentication ──────────────────────────────────────────────────
#
# No write scope. `contents: read` for checkout; `pull-requests: read`
# is reserved for future enhancements (e.g. posting check-run summaries).

name: checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Kept from Phase 614 (when it was `verify-all`'s only trigger) because
  # re-running the long jobs on demand is useful in its own right — e.g.
  # confirming a flake against an unchanged tree. Nothing in this
  # workflow deploys or publishes, so making it dispatchable is inert.
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  spdx-headers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Same CI workaround as publish-nuget.yml: the workspace-shared
      # local-feed at ../../local-nuget-feed is referenced by nuget.config
      # for dev-machine iteration; the runner has no such folder. An
      # empty dir lets NuGet enumerate it (0 packages) and proceed.
      - name: Create empty local-feed dir (CI workaround)
        run: mkdir -p ../../local-nuget-feed

      - name: Check Apache-2.0 SPDX headers
        run: dotnet run --project Build.fsproj -- AddHeaders --check

  fantomas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Same CI workaround as the other jobs: the dev-machine local feed
      # at ../../local-nuget-feed does not exist on the runner; an empty
      # dir lets NuGet enumerate it (0 packages) and proceed.
      - name: Create empty local-feed dir (CI workaround)
        run: mkdir -p ../../local-nuget-feed

      - name: Restore .NET local tools
        run: dotnet tool restore

      - name: Check formatting
        run: dotnet fantomas --check .

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # CONTRIBUTING.md §"Developer Certificate of Origin (DCO)" — every
      # commit in the PR must carry a `Signed-off-by:` trailer whose
      # name + email match the commit author. Merge commits are skipped
      # (they have no patch-author of their own). The implementation
      # avoids external Marketplace actions per the in-tree-tooling
      # stance — same posture as the rest of the workspace's build /
      # CI scripts.
      - name: Verify Signed-off-by on every PR commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          missing=()
          shas=$(git rev-list --no-merges "${BASE_SHA}..${HEAD_SHA}")
          if [ -z "${shas}" ]; then
            echo "No non-merge commits between base and head — nothing to check."
            exit 0
          fi
          for sha in ${shas}; do
            author=$(git log -1 --format='%an <%ae>' "${sha}")
            if ! git log -1 --format=%B "${sha}" \
                | grep -qFx "Signed-off-by: ${author}"; then
              missing+=("${sha}")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Commits missing a Signed-off-by trailer matching the commit author:"
            for sha in "${missing[@]}"; do
              author=$(git log -1 --format='%an <%ae>' "${sha}")
              subject=$(git log -1 --format='%s' "${sha}")
              echo "  ${sha:0:12}  ${author}  ${subject}"
            done
            echo
            echo "Fix: run \`git rebase --signoff ${BASE_SHA}\` to retroactively sign"
            echo "every commit in this PR. See CONTRIBUTING.md for the full DCO spec."
            exit 1
          fi
          count=$(echo "${shas}" | wc -l | tr -d ' ')
          echo "All ${count} commit(s) carry a Signed-off-by trailer matching the author."

  # Proves the portable ToolUp.AI.Wire layer compiles under BOTH hosts —
  # `dotnet build` (.NET) and `dotnet fable` (browser) — and that its
  # serialize/parse seam round-trips byte-identically on each. A wire layer
  # that builds clean on .NET but fails Fable would be broken-on-arrival for
  # the whole point of the package, so the Fable host gets its own gate.
  fable-wire-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Same CI workaround as the other jobs: the dev-machine local feed
      # at ../../local-nuget-feed does not exist on the runner; an empty
      # dir lets NuGet enumerate it (0 packages) and proceed.
      - name: Create empty local-feed dir (CI workaround)
        run: mkdir -p ../../local-nuget-feed

      - name: Build ToolUp.AI.Wire (.NET host)
        run: dotnet build src/ToolUp.AI.Wire/ToolUp.AI.Wire.fsproj

      - name: Run .NET (Expecto) host pack
        run: dotnet run --project src/ToolUp.AI.Wire.Tests/ToolUp.AI.Wire.Tests.fsproj

      - name: Restore Fable tool
        working-directory: src/ToolUp.AI.Wire.Fable.Tests
        run: dotnet tool restore

      - name: Compile to Fable (browser host)
        working-directory: src/ToolUp.AI.Wire.Fable.Tests
        run: dotnet fable -o output --noCache

      - name: Run Fable smoke under node:test
        working-directory: src/ToolUp.AI.Wire.Fable.Tests
        run: node --test output/Program.js

  # Wave 32 close-out (Phase 255) — the portability CONFORMANCE gate. Where
  # fable-wire-smoke proves the wire layer compiles + round-trips on each
  # host, this job proves the connector MAPPERS (OpenAI + Gemini + Claude)
  # produce byte-identical request JSON and an identical parsed
  # AIProviderResponse across the .NET and Fable backends, over one corpus.
  # The dual-run harness is a single shared source (ConformanceSuite.fs)
  # compiled by both hosts, so the assertion logic cannot drift. Both legs
  # must pass — a single host proves nothing about portability. See
  # src/ToolUp.AI.Wire.Conformance/PORTABILITY.md.
  ai-wire-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Same CI workaround as the other jobs: the dev-machine local feed at
      # ../../local-nuget-feed does not exist on the runner; an empty dir
      # lets NuGet enumerate it (0 packages) and proceed.
      - name: Create empty local-feed dir (CI workaround)
        run: mkdir -p ../../local-nuget-feed

      - name: Run conformance corpus on the .NET host (Expecto)
        run: dotnet run --project src/ToolUp.AI.Wire.Conformance/ToolUp.AI.Wire.Conformance.fsproj

      - name: Restore Fable tool
        working-directory: src/ToolUp.AI.Wire.Conformance/Fable
        run: dotnet tool restore

      - name: Compile the same corpus to Fable (browser host)
        working-directory: src/ToolUp.AI.Wire.Conformance/Fable
        run: dotnet fable -o output --noCache

      - name: Run the same corpus on the Fable host under node:test
        working-directory: src/ToolUp.AI.Wire.Conformance/Fable
        run: node --test output/ProgramFable.js

  # ─── Phase 614 / 617: the repo's two real test gates ───────────────
  #
  # `dotnet test` is deliberately NOT used anywhere here: these packs are
  # Expecto console runners (`<OutputType>Exe</OutputType>`), against
  # which `dotnet test` exits 0 having run nothing.
  #
  # Every .NET Expecto pack, via `dotnet run --project Build.fsproj --
  # VerifyAll`. The solution build ahead of it is NOT a warm-up: the
  # Public-API approval pack (Phase 175) reads every project's
  # `bin/Debug/net10.0` DLL and fails with a "run `dotnet build
  # ToolUp.Forge.sln` first" message when they are absent.
  #
  # ── History: why this job spent a while not gating ─────────────────
  #
  # Phase 614 wired it, ran it, and found the .NET suite was NOT green
  # on a Linux runner — four independent problems, none of them 614's
  # own. Rather than exclude packs or swallow exits, it shipped the job
  # `workflow_dispatch`-only with the evidence recorded here and filed
  # the blockers as Phase 617. 617 fixed them; the `if:` is gone and
  # this is now a gate on every push and PR. Two of the four turned out
  # to be defects in shipped SDK code, which is the return on having
  # run the suite somewhere other than a Windows dev box:
  #
  #   1. `ToolUp.Cli.Tests` HUNG — 47 minutes of silence until
  #      `timeout-minutes` killed the job, taking every later pack with
  #      it. A lock-order inversion inside Expecto: its redirected
  #      `Console.Out` writer and its ProgressIndicator take the
  #      redirected-writer monitor and the real console stream lock in
  #      opposite orders. This one was NOT confined to the pack that
  #      surfaced it — `ToolUp.Platform.Tests` deadlocks the same way,
  #      and had only been getting away with it because a 2-core runner
  #      rarely wins the race (it still hangs 2 runs in 6 at
  #      `--parallel-workers 2`). No Expecto flag avoids it and 11.1.0
  #      is worse than the pinned 10.2.3, so all twelve packs now
  #      default to `CLIArguments.Sequenced`. Costs nothing measurable:
  #      the 5,214-case Platform pack runs in 4m28s sequenced. Full
  #      analysis: docs/platform/testing-conventions.md.
  #   2. Ten `IAssetStore` cases errored with `DllNotFoundException:
  #      libSkiaSharp` — no SkiaSharp native for `linux-x64`. The test
  #      project now references the native assets, and the shipped
  #      renderer probes at construction and names the missing package
  #      instead of dying at first render (which is what a consumer
  #      deploying to a Linux container was hitting too).
  #   3. Two `DockerLocalContainerScheduler` cases failed because
  #      `alpine:latest` is not in a fresh runner's image cache, so
  #      `/containers/create` 404s. The contract pack skipped only on
  #      `SchedulerUnavailable` despite its own comment covering image
  #      pull failure. Fixed — and the image is pre-pulled below so the
  #      leg genuinely runs here rather than skipping.
  #   4. Two `StorageScopeResolver` cases — recorded by 614 as
  #      "timing-sensitive on a 2-core runner", which was WRONG. They
  #      reproduce deterministically under `--sequenced`.
  #      `LocalFileStorage.List` was returning the OS path separator, so
  #      `TeamStore.GetTeamMembers` read a `UserId` of
  #      `memberships\alice` on Windows, `IsLastOwner` never matched,
  #      and the last Owner of a team was removable there. Linux was
  #      behaving correctly and the tests encoded the Windows bug as
  #      their premise. Blob names are now normalised to `/` and the
  #      shape is pinned by the `IBlobStorage` contract pack.
  #
  # Measured cost (2-core ubuntu-latest, warm NuGet cache): solution
  # build 6m10s, then the packs — Platform alone is 5m36s for 5,214
  # cases. Budget ~15 minutes for a completing run. `timeout-minutes`
  # stays generous but finite: a hang must fail loudly rather than burn
  # the 6-hour default, which is exactly how (1) was caught.
  #
  # ── The CloudParity emulator legs are NOT armed here. Deliberate. ──
  #
  # `CloudParity` is one of the fourteen packs below, so it RUNS on every
  # push — but all nine of its emulator legs (3 seams x 3 clouds) report
  # `pending` here, because none of the `TOOLUP_PARITY_*` variables is
  # set and no emulator is booted. Only its 7 always-on cases (the
  # divergence fixture + the seam ratchets) actually gate. That posture
  # is named here rather than left to be re-derived, because a pack that
  # is green while measuring nothing is the failure mode this whole
  # matrix exists to avoid.
  #
  # Arming it is cheap and the machinery is ready: `docker` is already
  # present on `ubuntu-latest` (the container-scheduler leg below relies
  # on that), `compose.parity.yml` at the repo root brings the emulators
  # up in one command, and the exact recipe is in
  # docs/migrations/193-multi-cloud-parity-conformance-matrix.md.
  #
  # It is not armed because **no leg is green yet**, and Phase 732
  # established that by running all three for the first time: 87 cases
  # armed, 78 passing, 16 red. Arming any single leg today would land a
  # knowingly-red gate, and a gate that is red on arrival is one people
  # learn to step over — which costs more than the check earns. The
  # alternative, arming a leg with its red cases excluded, trades a gate
  # for a tick and is refused for the same reason Phase 614 refused it.
  #
  # The three blockers, none of them CI-setup problems and none fixable
  # in a workflow file:
  #
  #   1. `DownloadRange past EOF returns Ok [||]` fails on ALL THREE
  #      clouds (Azure 416 InvalidRange, AWS 416 not-satisfiable, GCP
  #      likewise). The contract encodes local-only behaviour that no
  #      real object store exhibits. Resolving it is a contract
  #      decision, not a bug fix.
  #   2. `ISecretStore` on LocalStack scores 1/9. Not the emulator — a
  #      direct `aws secretsmanager` probe against the same container
  #      works. `ToolUp.Secrets.AwsSecretsManager` matches vendor
  #      exceptions with `:? ResourceNotFoundException`, but they arrive
  #      wrapped in `AggregateException`, so no handler matches and the
  #      companion's new-secret write path is dead.
  #   3. Five GCP `DownloadRange` cases fail on fake-gcs-server's
  #      whole-object checksum being returned for partial responses (an
  #      emulator-fidelity limit), plus one more instance of (2)'s class
  #      in `ToolUp.Storage.GoogleCloudStorage.Delete`.
  #
  # **Arm the Azurite leg first** once (1) and the Azure half of the
  # audit story are settled: it is the cheapest (one container, no init
  # service, no credentials) and already scores 25/26. Two steps —
  # `docker compose -f compose.parity.yml up -d --wait azurite` and
  # `TOOLUP_PARITY_AZURITE: UseDevelopmentStorage=true` in the `env:`
  # of the VerifyAll step. Do not arm a leg while it has a red case.
  verify-all:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      # The federation-seam specification and its conformance corpus are NOT
      # in this repository — this repository is an emitter certifying against
      # them, and a specification owned by one of its implementations cannot
      # be conformed to by the others on equal terms.
      #
      # Pinned to a REF, not to a branch. The corpus is the oracle this
      # repository's conformance leg is measured against, so tracking its
      # default branch would let an upstream edit turn this gate red (or,
      # worse, green) with no commit here — a gate whose verdict can change
      # without a change is not a gate. Moving the pin is deliberate, and it
      # belongs in the same commit as whatever emitter change required it.
      #
      # The harness finds it by DIRECTORY name, so `path` is the interface
      # and the repository name is free to change without touching this.
      # Operator setup: repository variable `FEDERATION_SPEC_REPO` (`owner/name`
      # of the specification home) and repository secret
      # `FEDERATION_SPEC_READ_TOKEN` (a token with read access to it).
      #
      # The name goes through a VARIABLE rather than a literal because that
      # repository is private and this one is public — a literal would publish
      # the private repo's name in a world-readable file. It was public when
      # this step was written, which is why the literal was harmless then and
      # is not now (flipped private 2026-08-20).
      #
      # The guard below runs first because `actions/checkout` with an empty
      # `repository` silently re-checks-out THIS repo: the conformance leg
      # would then run against the wrong tree and fail later wearing the wrong
      # reason. A PR from a fork cannot read repository secrets, so this job
      # fails there by design rather than skipping — a conformance job that
      # skips when it cannot reach its corpus reports green while certifying
      # nothing.
      - name: Check the federation-spec configuration is present
        env:
          SPEC_REPO: ${{ vars.FEDERATION_SPEC_REPO }}
          SPEC_TOKEN: ${{ secrets.FEDERATION_SPEC_READ_TOKEN }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${SPEC_REPO}" ]; then
            echo "::error::Repository variable FEDERATION_SPEC_REPO is unset. It must hold the owner/name of the federation-seam specification home."
            missing=1
          fi
          if [ -z "${SPEC_TOKEN}" ]; then
            echo "::error::Repository secret FEDERATION_SPEC_READ_TOKEN is unset. It must hold a token with read access to that repository. (A pull request from a fork cannot read repository secrets; this job fails there by design rather than skipping.)"
            missing=1
          fi
          if [ "${missing}" -ne 0 ]; then
            echo "::error::The federation-seam conformance leg cannot run without its specification home, and a conformance run without its corpus certifies nothing."
            exit 1
          fi

      - name: Check out the federation-seam specification home
        uses: actions/checkout@v6
        with:
          repository: ${{ vars.FEDERATION_SPEC_REPO }}
          ref: 480c03b2ca74e8493bfbb1e005fb30293f4c7078
          token: ${{ secrets.FEDERATION_SPEC_READ_TOKEN }}
          path: fuaran-federation-spec
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Restore dominates a cold run of this job; the key covers every
      # input that can change the resolved graph (CPM manifest, SDK pin,
      # and the project files themselves).
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json', '**/*.fsproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # Same CI workaround as the other jobs: the dev-machine local feed
      # at ../../local-nuget-feed does not exist on the runner; an empty
      # dir lets NuGet enumerate it (0 packages) and proceed.
      - name: Create empty local-feed dir (CI workaround)
        run: mkdir -p ../../local-nuget-feed

      # The `IContainerScheduler` contract pack's real-backend leg binds
      # against the runner's Docker daemon and launches a container. The
      # daemon is present on `ubuntu-latest`; `alpine:latest` is not in
      # its image cache, and the scheduler drives the Docker HTTP API
      # directly, where `/containers/create` does NOT pull on demand the
      # way `docker run` does. Without this the leg skips itself — which
      # is honest but gates nothing, and this workflow exists to gate.
      # Cheap (a ~4 MB image) and off the critical path.
      - name: Pre-pull the container-scheduler test image
        run: docker pull alpine:latest

      # ─── The model-execution conformance corpus ────────────────────
      #
      # `ToolUp.Platform.Tests` carries a conformance family that
      # certifies the model-execution wire face against an EXTERNAL,
      # language-neutral corpus — a specification and fixture set that is
      # canonical over this implementation rather than emitted from it,
      # which is the whole reason it can find a defect no in-repo fixture
      # would. It is not vendored here, so CI has to fetch it.
      #
      # Four things about the shape below are deliberate:
      #
      #   1. **The corpus repository is named by a repository VARIABLE,
      #      not a literal.** The corpus lives in a private repository
      #      whose name is not published here, and this workflow file is
      #      public. A variable keeps the operational fact (where to
      #      fetch from) in repository settings and out of the public
      #      tree, at no cost to reproducibility.
      #   2. **The revision IS a literal, and belongs in the tree.** The
      #      pin is the reviewable artefact: a corpus commit must never
      #      change what this build certifies without a reviewed commit
      #      here. It is the same value the harness pins in code, and the
      #      two are bumped together.
      #   3. **A missing variable or secret FAILS this job.** The guard
      #      step below runs first and says which one is unset. Without
      #      it, `actions/checkout` with an empty `repository` silently
      #      re-checks-out this repo, and the failure would arrive later
      #      wearing the wrong reason. A conformance job that skips when
      #      it cannot reach its corpus is worse than no job: it reports
      #      green.
      #   4. **A fork PR cannot read the secret, so this job fails on
      #      one.** That is a real cost and is recorded rather than
      #      worked around, because the alternative — degrading to a skip
      #      — is the failure mode point 3 exists to prevent. It changes
      #      if and when the corpus's home is made public.
      #
      # Operator setup: repository variable `MODEL_EXECUTION_SPEC_REPO`
      # (`owner/name` of the corpus repository) and repository secret
      # `MODEL_EXECUTION_SPEC_READ_TOKEN` (a PAT with read access to it).
      - name: Check the conformance-corpus configuration is present
        env:
          CORPUS_REPO: ${{ vars.MODEL_EXECUTION_SPEC_REPO }}
          CORPUS_TOKEN: ${{ secrets.MODEL_EXECUTION_SPEC_READ_TOKEN }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${CORPUS_REPO}" ]; then
            echo "::error::Repository variable MODEL_EXECUTION_SPEC_REPO is unset. It must hold the owner/name of the model-execution conformance corpus repository."
            missing=1
          fi
          if [ -z "${CORPUS_TOKEN}" ]; then
            echo "::error::Repository secret MODEL_EXECUTION_SPEC_READ_TOKEN is unset. It must hold a token with read access to that repository. (A pull request from a fork cannot read repository secrets; this job fails there by design rather than skipping.)"
            missing=1
          fi
          if [ "${missing}" -ne 0 ]; then
            echo "::error::The model-execution conformance family cannot run without its corpus, and a conformance run without its corpus certifies nothing."
            exit 1
          fi

      - name: Check out the model-execution conformance corpus
        uses: actions/checkout@v6
        with:
          repository: ${{ vars.MODEL_EXECUTION_SPEC_REPO }}
          # Pinned. Bump this together with `Pin.commit` /
          # `Pin.manifestDigest` in
          # src/ToolUp.Platform.Tests/Conformance/ModelExecutionSpecConformance.fs,
          # in one reviewed commit, after reading the corpus diff.
          ref: b55833f18334d4fd846c2cd91514946e95ca1941
          token: ${{ secrets.MODEL_EXECUTION_SPEC_READ_TOKEN }}
          path: .model-execution-corpus
          persist-credentials: false

      - name: Build the solution
        run: dotnet build ToolUp.Forge.sln --nologo

      # ─── Memory headroom for the test step (2026-08-19) ─────────────
      #
      # RESOLVED the same day: the actual killer was HNSW.Net's
      # construction distance cache allocating ~4 GB per graph build at
      # its default size, fixed at the call site in
      # ToolUp.VectorStores.Hnsw (this job's peak memory measured
      # 3.0 GB after vs 15.8 GB + runner kill before). The steps below
      # predate that finding and are KEPT as cheap headroom — the
      # narrative that follows records the hunt as it stood mid-way.
      #
      # From 2026-08-06 (the commit that added the model-execution
      # conformance family) this job failed most runs with
      # `Process completed with exit code 143` ~60-90s into the Platform
      # pack — SIGTERM from the runner, the hosted-runner
      # memory-exhaustion signature, after ~16s of thrash silence. The
      # diagnosis is pressure, not a broken test: successes and failures
      # alternated on near-identical code on 2026-08-09 (a marginal
      # resource, not a deterministic bug), completing runs take
      # 12.5-14.8 min while every failure died at ~8 min (~1 min into
      # the tests), and the same suite passes locally on a larger
      # machine in ~12 min. The 7-minute solution build leaves MSBuild
      # worker nodes — where fsc runs and holds this ~50-project F#
      # solution's compile state — resident via node reuse; the test
      # hosts then stack on top of them on a 16 GB VM.
      #
      # Three levers, cheapest first. If 143 recurs with these in
      # place, the next lever is splitting build and test into two jobs
      # (fresh VM for the test half). The `free -m` probes exist so the
      # log carries the before/after evidence rather than a theory.
      - name: Release build-server memory before the tests
        run: |
          free -m
          dotnet build-server shutdown
          free -m

      # The count assertion is the point of this step, not decoration.
      # `VerifyAll` is a no-op that EXITS 0 when `BuildConfig.TestPacks`
      # is empty — a documented path, since the target ships in the SDK
      # for consumers who have not opted in. A job that only checked the
      # exit status would report green for a forge `Build.fs` that had
      # lost its pack list, which is indistinguishable from a real pass
      # unless the summary block is read. So: the summary must exist, it
      # must list at least every pack we expect, and none may be FAIL.
      - name: Run every Expecto pack (VerifyAll)
        env:
          # Raised 12 → 14 by Phase 731. Fourteen packs ship, and a floor
          # of twelve let the two newest vanish silently — precisely the
          # protection the floor exists to give. It is a LOWER bound, so
          # ADDING a pack never needs an edit here; only removing one
          # deliberately does.
          EXPECTED_PACKS: 14
          # Part of the memory-headroom block above. Since Phase 731
          # VerifyAll builds ONCE and then launches each pack's built dll
          # directly, so the per-pack inner builds this originally guarded
          # against are gone; the single up-front build still spawns
          # reusable MSBuild workers that would otherwise sit idle holding
          # fsc compile state while the test hosts run. With node reuse
          # off they exit when that build completes.
          MSBUILDDISABLENODEREUSE: "1"
          # Named explicitly rather than left to the harness's own
          # search: on a runner the search would work, but a wrong
          # answer here should be a configuration error with a name on
          # it, not a corpus quietly discovered somewhere unexpected.
          TOOLUP_MODEL_EXECUTION_CORPUS: ${{ github.workspace }}/.model-execution-corpus/wire-fixtures
          # The 2026-08-19 exit-143 hunt is CLOSED — root cause was
          # HNSW.Net's construction distance cache allocating ~4 GB per
          # graph build at its default size (fixed at the call site in
          # ToolUp.VectorStores.Hnsw; peak job memory measured 3.0 GB
          # after vs 15.8 GB + runner kill before). If a kill of that
          # shape ever recurs, the diagnostics that solved it are one
          # env line away: set `TOOLUP_TEST_ARGS: "--debug"` here so
          # Expecto names each test as it starts, and re-add a
          # `free -m` sampler loop around the run — see the commit
          # history of this block for the exact shape.
        run: |
          set -euo pipefail
          dotnet run --project Build.fsproj -- VerifyAll 2>&1 | tee verifyall.log

          summary=$(awk '/VerifyAll summary:/{seen=1} seen' verifyall.log)
          if [ -z "${summary}" ]; then
            echo "::error::VerifyAll printed no summary block — the target did not run any pack."
            exit 1
          fi

          passed=$(printf '%s\n' "${summary}" | grep -c 'PASS' || true)
          failed=$(printf '%s\n' "${summary}" | grep -c 'FAIL' || true)
          echo "VerifyAll summary: ${passed} pack(s) PASS, ${failed} pack(s) FAIL."

          if [ "${failed}" -ne 0 ]; then
            echo "::error::${failed} Expecto pack(s) failed."
            exit 1
          fi
          if [ "${passed}" -lt "${EXPECTED_PACKS}" ]; then
            echo "::error::Only ${passed} pack(s) ran; expected at least ${EXPECTED_PACKS}. A short run means the pack list shrank or VerifyAll no-opped, not that the suite got faster. Check BuildConfig.TestPacks in Build.fs before lowering EXPECTED_PACKS."
            exit 1
          fi

  # Gate 2 of 2 — the client-tier harness. Fable-transpiled F# run under
  # Node's built-in `node:test`; it is the only place the Platform.Client
  # MVU surfaces (every Sidebar pack, the rail a11y floor, the structural
  # snapshot gate) can execute at all, because their module-level
  # Remoting proxy constructors are reflection-shaped for Fable and throw
  # under .NET reflection.
  #
  # One command, shared with developers verbatim:
  # `dotnet run --project Build.fsproj -- VerifyFable`. That target owns
  # the tool restore, `npm ci`, the Fable compile and the run, AND
  # asserts the TAP pass/fail counts — `node --test` exits 0 when it
  # matched no tests, so the counts, not the exit status, are the gate.
  fable-tier:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/ToolUp.AI.Client.Tests/package-lock.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json', '**/*.fsproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # Same CI workaround as the other jobs: the dev-machine local feed
      # at ../../local-nuget-feed does not exist on the runner; an empty
      # dir lets NuGet enumerate it (0 packages) and proceed.
      - name: Create empty local-feed dir (CI workaround)
        run: mkdir -p ../../local-nuget-feed

      - name: Run the Fable-tier node:test harness (VerifyFable)
        run: dotnet run --project Build.fsproj -- VerifyFable

  # ─── Phase 620: the docs gate ──────────────────────────────────────
  #
  # Extracts every in-scope ```fsharp block from `docs/**` and
  # `src/ToolUp.Platform/technical-guide/**` and COMPILES it against the
  # real SDK. The class it closes: a snippet naming an API the SDK no
  # longer has. Readers copy these blocks verbatim, so a renamed field
  # is a defect that ships to every reader and is visible to no test.
  # Both live instances that motivated the phase — the stale OIDC block
  # in `docs/platform/auth.md` and the `Mode = Individual` block in the
  # technical guide — were found by a human noticing.
  #
  # `VerifyDocSnippets` owns extraction, generation, compilation and the
  # verdict, so this job and a developer necessarily run the same thing
  # — the `VerifyFable` precedent. The scope convention, the closed set
  # of skip reasons, and the baseline's ratchet are documented at
  # `docs-snippets/README.md`; the design rationale is in the target's
  # own header in `Build.fs`.
  #
  # ── This job cannot pass vacuously ─────────────────────────────────
  #
  # Three independent ways, because "the docs gate went green" has more
  # ways of being meaningless than most:
  #   1. An extraction floor. The target legitimately exits 0 over an
  #      empty corpus — a moved docs folder, a fence parser that stopped
  #      matching — which is indistinguishable from a pass. It fails
  #      below 300 extracted blocks (currently 385). Same shape as
  #      `VerifyFable`'s TAP case floor and `verify-all`'s pack count.
  #   2. Unattributable compiler errors are a HARNESS fault, never
  #      absorbed as doc drift. If the preamble or the project
  #      references break, the target fails loudly rather than quietly
  #      reporting every block as drifted.
  #   3. The baseline is shrink-only. `known-drift.txt` records the 230
  #      blocks that were ALREADY broken when the gate landed, keyed by
  #      a hash of each block's own text. A failing block absent from it
  #      fails the job; a listed block that now compiles ALSO fails the
  #      job until its line is deleted. Because the key is the content
  #      hash, editing a listed block retires its entry — a broken
  #      snippet cannot be rewritten into a differently-broken one.
  #
  # The baseline is the honest posture, not a mute button: 230 already-
  # drifted snippets is a docs project, and the alternative — marking
  # them `skip=` — would be a lie, since `skip` claims a block is not
  # CHECKABLE, not that it is checkable and wrong. Same call Phase 614
  # made when `verify-all` was not green on Linux, and the same shape as
  # the Phase 175 public-API approval baseline.
  #
  # ── Trigger ────────────────────────────────────────────────────────
  #
  # `push` + `pull_request`, matching every other gate here and for the
  # reason recorded at the top of this file: this repo's normal
  # integration path is a DIRECT PUSH to `main`, so a PR-only gate would
  # almost never run, and a gate that does not run is worse than no gate
  # because it reports green. Cost is not a constraint that would argue
  # otherwise — the repository is public, so runners are free and
  # unmetered, and the concurrency group cancels superseded runs.
  #
  # Measured cost: 1m29s end to end on a fresh worktree with a warm
  # NuGet cache (dev machine, cold build of the ~47 referenced SDK
  # projects, which dominates); 31s warm, of which extraction and the
  # snippet compile are ~20s. Budget ~10 minutes on a 2-core runner.
  # `timeout-minutes` stays generous but finite so a hang fails loudly
  # instead of burning the 6-hour default.
  #
  # That is roughly a fifth of `verify-all`, and it is a fraction of the
  # solution: the referenced set is the SDK surface the docs actually
  # teach, not everything.
  doc-snippets:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json', '**/*.fsproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # Same CI workaround as the other jobs: the dev-machine local feed
      # at ../../local-nuget-feed does not exist on the runner; an empty
      # dir lets NuGet enumerate it (0 packages) and proceed.
      - name: Create empty local-feed dir (CI workaround)
        run: mkdir -p ../../local-nuget-feed

      - name: Compile every in-scope documentation snippet (VerifyDocSnippets)
        run: dotnet run --project Build.fsproj -- VerifyDocSnippets

  # ─── The template-content gate ─────────────────────────────────────
  #
  # Compiles the `dotnet new` scaffolds under `templates/`. Same class as
  # the docs gate one job above: content shipped to consumers, verbatim,
  # that no build touched. Two of them had been broken for an unknown
  # span — platformsdk-application's client carried a PackageReference
  # the 0.4.4 transport fold deleted (NU1010 under CPM) plus a
  # `ClientConfigOverrides` reference needing module qualification, and
  # platformsdk-datamanager's Server.fs implemented an `IDataSource`
  # shape (Id / DisplayName / Probe / Pull) the SDK no longer has. A
  # consumer running `dotnet new` got a project that did not compile.
  #
  # ── Why this is a separate job and not part of verify-all ───────────
  #
  # Template projects reference ToolUp.Platform.* by PackageReference —
  # they must, because that is what a consumer's instantiated copy does
  # — while forge itself consumes them only by ProjectReference. Adding
  # them to ToolUp.Forge.sln would make the solution restore need
  # packages that do not exist on a runner (the local-feed dir every job
  # creates here is EMPTY), taking the whole `verify-all` gate down with
  # it. `VerifyTemplates` supplies the packages instead of assuming
  # them: it packs the six-package closure at a throwaway version into a
  # scratch feed, then builds each template against that.
  #
  # ── This job cannot pass vacuously ─────────────────────────────────
  #
  #   1. The throwaway version defeats the NuGet cache. Packing at
  #      $(ToolUpSdkVersion) would be a same-version repack, and NuGet
  #      would serve the already-extracted global-packages entry — the
  #      gate would compile against whatever was packed last, not
  #      current source. The target wipes those cache entries first.
  #   2. NU1603 is escalated to an error. It fires when a gate-versioned
  #      package declares a ToolUp.* dependency that was not packed at
  #      the gate version, in which case NuGet silently falls back to
  #      some older version off a feed. Escalated, a new SDK->SDK
  #      dependency fails the job by name instead of quietly weakening
  #      what is being tested. This was not hypothetical — the first
  #      draft of the target had exactly that hole.
  #   3. Each template's obj/ and bin/ are cleared before building.
  #      NuGet no-ops a restore whose inputs are unchanged and REPLAYS
  #      the warnings cached in project.assets.json, so a leftover obj/
  #      makes the gate report a previous run's resolution. It also
  #      matches what a consumer has: nothing.
  #
  # Both fixes were verified by reintroducing the original defects and
  # confirming the target goes red, then reverting.
  #
  # NOT COVERED: templates/safer/ and templates/platformsdk-solution/
  # are standalone solutions with their own nuget.config (a
  # `../local-nuget-feed` path resolved relative to the consumer's
  # instantiated location) and, in safer's case, a literal
  # TOOLUP_SDK_VERSION placeholder substituted at instantiation. Neither
  # is buildable in-repo without rewriting the thing that makes it a
  # template; gating them needs an instantiate-then-build harness. All
  # the drift found so far was in the root-inheriting set.
  #
  # Measured cost: ~30s warm on the dev machine, dominated by packing
  # the six packages.
  templates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json', '**/*.fsproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # Same CI workaround as the other jobs: the dev-machine local feed
      # at ../../local-nuget-feed does not exist on the runner; an empty
      # dir lets NuGet enumerate it (0 packages) and proceed. The gate
      # does not read it — its packages come from the scratch feed the
      # target packs, verified by building with this source excluded.
      - name: Create empty local-feed dir (CI workaround)
        run: mkdir -p ../../local-nuget-feed

      - name: Compile the dotnet-new template content (VerifyTemplates)
        run: dotnet run --project Build.fsproj -- VerifyTemplates
