# Publish every public-surface SDK package to nuget.org on a release
# tag (Phase 346, 2026-08-19 — the anonymous-restore front door).
#
# The original Phase 11.C.3 GitHub Packages lane (2026-05-28) was
# REMOVED the same day nuget.org went live (operator decision
# 2026-08-19): GH Packages' NuGet registry demands an authenticated
# classic PAT even for public packages, so it could never serve as a
# practical failover — a consumer wired to nuget.org cannot fall back
# to it without minting a credential mid-outage — and a second lane
# can diverge from the first on a partial publish failure. The feed at
# https://nuget.pkg.github.com/ToolUp-Forge/ is frozen (≤ 0.20.0,
# inert history); do not re-add a push to it.
#
# ─── Trigger ─────────────────────────────────────────────────────────
#
# - `v*.*.*` tag push — coordinated SDK-wide release. Every IsPackable
#   fsproj packs at its current <Version> — the centralised <Version> in
#   Directory.Build.props, unless a per-fsproj <Version> override applies.
#   NOTE: <Version> (what packs + publishes here) is a SEPARATE knob from
#   the meta-manifest's <ToolUpSdkVersion> in Directory.Packages.props
#   (the version at which a *consumer* pins every ToolUp.* package via the
#   ToolUp.Sdk meta-manifest). The two are maintained independently and
#   are NOT auto-derived from each other — keep them in sync at release
#   time. Per-package independent bumps remain possible via a per-fsproj
#   <Version> override; the tag scheme `v{Package}/{Version}` is reserved
#   for that future shape but not yet wired here.
# - `workflow_dispatch` — manual re-run after a transient CI failure.
#   Idempotent thanks to `--skip-duplicate` in the FAKE Publish target —
#   re-runs cleanly skip versions already pushed. CAUTION: a dispatch
#   packs main's CURRENT <Version>, tagged or not — dispatch only to
#   heal a failed tag run, never to publish ahead of a tag.
#
# ─── Authentication — Trusted Publishing (Phase 346) ─────────────────
#
# No long-lived credential exists anywhere. The `NuGet/login` action
# exchanges this job's GitHub OIDC token (the `id-token: write`
# permission below, also required by the Phase 182 attestation) for a
# one-hour temporary API key, validated on nuget.org against a Trusted
# Publishing policy the operator registers there (Repository Owner
# `ToolUp-Forge`, Repository `toolup-forge`, Workflow File
# `publish-nuget.yml`, package glob `ToolUp.*`). The only stored value
# is the `NUGET_USER` repo secret — the nuget.org PROFILE NAME (not
# email) owning the policy. The login step is deliberately UNGUARDED:
# a tag push that cannot publish must fail loudly, because a silently
# skipped release (a lost secret, a fork tag) reads as a green run.
# Nothing rotates: the temp key dies within the hour.

name: publish-nuget

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  # `id-token: write` serves BOTH OIDC consumers: the NuGet/login
  # trusted-publishing exchange and the Phase 182 build-provenance
  # attestation (`attest-build-provenance` mints a signed in-toto
  # statement per published nupkg; `attestations: write` records it
  # against the repo).
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Workaround for NU1301 on a fresh CI checkout: the repo's
      # `nuget.config` declares a `local` source at `..\..\local-nuget-feed`
      # for dev-machine cross-repo iteration. That folder exists on the
      # workspace root locally but not on the runner; NuGet treats the
      # missing path as a hard error during restore. Creating an empty
      # dir lets NuGet enumerate it (0 packages) and proceed to
      # `nuget.org` for external deps. No effect on the published nupkgs.
      - name: Create empty local-feed dir (CI workaround)
        run: mkdir -p ../../local-nuget-feed

      # The one-hour temp key comfortably covers the ~10-minute pack that
      # follows; one OIDC token buys exactly one temporary key.
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      # The FAKE Publish target packs every public-surface fsproj into
      # ./artifacts/ and pushes each .nupkg to nuget.org with
      # `--skip-duplicate` (idempotent — nuget.org versions are
      # immutable). `dotnet nuget push` auto-detects the matching
      # `.snupkg` beside each `.nupkg` and pushes it to the symbol
      # server; no separate symbol handling exists here.
      - name: Pack + push every public-surface SDK package to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          # Phase 182 — turn on per-package CycloneDX SBOM emission on the
          # release path (default-off elsewhere, GP 11/13). SBOMs land in
          # ./artifacts/ alongside the nupkgs; the push loop filters to
          # *.nupkg, so the .cdx.json files are never pushed to the feed.
          TOOLUP_EMIT_SBOM: "true"
        run: dotnet run --project Build.fsproj -- Publish

      # Phase 182 — signed build-provenance attestation for every pushed
      # package. Binds each artefact's SHA-256 digest to this workflow run
      # (source commit + build environment) via an in-toto provenance
      # statement signed through Sigstore. A consumer verifies with
      # `gh attestation verify <nupkg> --repo ToolUp-Forge/toolup-forge`.
      # Runs after the push so a publish failure never produces a dangling
      # attestation; the nupkgs persist in ./artifacts/ from the step above.
      - name: Attest build provenance for published packages
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "artifacts/*.nupkg"

      # Phase 182 — retain the per-package SBOMs as a downloadable run
      # artefact (GitHub Packages NuGet has no SBOM slot). `warn` rather
      # than `error` so a manual re-run that skips every duplicate (no new
      # SBOMs) doesn't fail the job.
      - name: Upload SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: "artifacts/*.cdx.json"
          if-no-files-found: warn
