# Publish every public-surface SDK package to nuget.org on a release
# tag (Phase 346, 2026-08-19 — the anonymous-restore front door).
#
# The original Phase 11.C.3 GitHub Packages lane (2026-05-28) was
# REMOVED the same day nuget.org went live (operator decision
# 2026-08-19): GH Packages' NuGet registry demands an authenticated
# classic PAT even for public packages, so it could never serve as a
# practical failover — a consumer wired to nuget.org cannot fall back
# to it without minting a credential mid-outage — and a second lane
# can diverge from the first on a partial publish failure. The feed at
# https://nuget.pkg.github.com/ToolUp-Forge/ is frozen (≤ 0.20.0,
# inert history); do not re-add a push to it.
#
# ─── Trigger ─────────────────────────────────────────────────────────
#
# - `v*.*.*` tag push — coordinated SDK-wide release. Every IsPackable
#   fsproj packs at its current <Version> — the centralised <Version> in
#   Directory.Build.props, unless a per-fsproj <Version> override applies.
#   NOTE: <Version> (what packs + publishes here) is a SEPARATE knob from
#   the meta-manifest's <ToolUpSdkVersion> in Directory.Packages.props
#   (the version at which a *consumer* pins every ToolUp.* package via the
#   ToolUp.Sdk meta-manifest). The two are maintained independently and
#   are NOT auto-derived from each other — keep them in sync at release
#   time. Per-package independent bumps remain possible via a per-fsproj
#   <Version> override; the tag scheme `v{Package}/{Version}` is reserved
#   for that future shape but not yet wired here.
# - `workflow_dispatch` — manual re-run after a transient CI failure.
#   Idempotent thanks to `--skip-duplicate` in the FAKE Publish target —
#   re-runs cleanly skip versions already pushed. CAUTION: a dispatch
#   packs main's CURRENT <Version>, tagged or not — dispatch only to
#   heal a failed tag run, never to publish ahead of a tag.
#
# ─── Authentication — Trusted Publishing (Phase 346) ─────────────────
#
# No long-lived credential exists anywhere. The `NuGet/login` action
# exchanges this job's GitHub OIDC token (the `id-token: write`
# permission below, also required by the Phase 182 attestation) for a
# one-hour temporary API key, validated on nuget.org against a Trusted
# Publishing policy the operator registers there (Repository Owner
# `ToolUp-Forge`, Repository `toolup-forge`, Workflow File
# `publish-nuget.yml`, package glob `ToolUp.*`). The only stored value
# is the `NUGET_USER` repo secret — the nuget.org PROFILE NAME (not
# email) owning the policy. The login step is deliberately UNGUARDED:
# a tag push that cannot publish must fail loudly, because a silently
# skipped release (a lost secret, a fork tag) reads as a green run.
# Nothing rotates: the temp key dies within the hour.
#
# ─── The `ToolUp.*` glob is a CONSTRAINT, not a description (Phase 754)
#
# Every package this workflow can publish must match the policy glob.
# The Phase 344 AG Grid / AG Charts bindings did not: they packed as
# `Feliz.AgGrid` / `Feliz.AgCharts` / `Feliz.AgGrid.Enterprise`, outside
# the glob — and `Feliz.AgGrid` is in any case Compositional-IT's
# unmaintained package on nuget.org, the one that extraction exists to
# supersede. A `v*` tag would therefore have pushed three packages the
# policy refuses, at ids this project does not own. Phase 754 moved them
# to `ToolUp.Feliz.AgGrid` / `ToolUp.Feliz.AgCharts` /
# `ToolUp.Feliz.AgGrid.Enterprise` (operator decision 2026-09-01), inside
# the glob and under ids this project does own.
#
# So: a NEW packable project whose `PackageId` falls outside `ToolUp.*`
# is a release defect, and the `Publish` target packs `src/**/*.fsproj`
# by GLOB — nothing here enumerates package ids, so nothing here will
# notice. Set the id, or set `<IsPackable>false</IsPackable>`.
#
# The in-repo counterpart to that discipline is the template gate's
# stranger's-package guard (`TemplateGate.unproducedIds`, Build.fs): it
# fails when a declared gate id is one this repo does not itself
# produce, which is the same mistake caught one step earlier.

name: publish-nuget

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  # `id-token: write` serves BOTH OIDC consumers: the NuGet/login
  # trusted-publishing exchange and the Phase 182 build-provenance
  # attestation (`attest-build-provenance` mints a signed in-toto
  # statement per published nupkg; `attestations: write` records it
  # against the repo).
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Phase 260 — `fetch-depth: 0` is a PRECONDITION of the version
      # check below, not a nicety. That check derives the bump by diffing
      # api-baselines/ at the LAST RELEASE TAG against this tree, and the
      # default shallow checkout carries neither the tag nor the history
      # behind it. It fails rather than reporting green on a comparison it
      # could not make, so a shallow checkout would turn every release red.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Workaround for NU1301 on a fresh CI checkout: the repo's
      # `nuget.config` declares a `local` source at `..\..\local-nuget-feed`
      # for dev-machine cross-repo iteration. That folder exists on the
      # workspace root locally but not on the runner; NuGet treats the
      # missing path as a hard error during restore. Creating an empty
      # dir lets NuGet enumerate it (0 packages) and proceed to
      # `nuget.org` for external deps. No effect on the published nupkgs.
      - name: Create empty local-feed dir (CI workaround)
        run: mkdir -p ../../local-nuget-feed

      # Phase 326 — the release cannot publish a package the ToolUp.Sdk
      # meta-manifest does not advertise, nor a manifest MSBuild cannot
      # import.
      #
      # `ToolUp.Sdk.props` is what a consumer imports to resolve every
      # ToolUp.* package from one <ToolUpSdkVersion>. It was hand-listed
      # and had drifted to 57 of 166 published ids (the rest were NU1008
      # for any consumer), and its header comment nested a second XML
      # comment, which made the whole import MSB4024 — the manifest
      # resolved nothing at all. Neither could be seen from inside this
      # repo, because nothing here imports its own meta-manifest; the
      # only place the two facts meet is the release that publishes the
      # packages the manifest is supposed to name. So the check runs
      # here, on that release.
      #
      # BEFORE the login step deliberately: a release that cannot publish
      # correctly should fail without minting a credential first.
      - name: Verify the ToolUp.Sdk meta-manifest matches the packable set
        run: dotnet run --project Build.fsproj -- GenerateSdkManifest --check

      # Phase 260 — the release cannot publish a version that claims a
      # smaller change than the public surface actually made.
      #
      # The bump is DERIVED: the committed api-baselines at the last
      # release tag are diffed against this tree with the same comparer
      # the public-API approval gate runs (Phase 175/618), each package
      # classified unchanged / additive / breaking, and the highest class
      # rolled up to the one lockstep <Version>. A declared version at or
      # above what that demands passes; below it fails. It never edits
      # the version — the proposal is advice, the check is a floor.
      #
      # It needs the tag history, which is why the checkout above sets
      # `fetch-depth: 0`.
      #
      # Here rather than in `verify.ps1` for the reason the manifest
      # check above is here: this is the moment the two facts meet. The
      # RULE it applies is exercised on every commit by the
      # ToolUp.Platform.Build.Tests pack, so this is not its first run.
      #
      # BEFORE the login step, same as above: a release that cannot be
      # versioned correctly should fail without minting a credential.
      - name: Verify the declared version matches the public-surface diff
        run: dotnet run --project Build.fsproj -- VerifySemVerBump

      # The one-hour temp key comfortably covers the ~10-minute pack that
      # follows; one OIDC token buys exactly one temporary key.
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      # The FAKE Publish target packs every public-surface fsproj into
      # ./artifacts/ and pushes each .nupkg to nuget.org with
      # `--skip-duplicate` (idempotent — nuget.org versions are
      # immutable). `dotnet nuget push` auto-detects the matching
      # `.snupkg` beside each `.nupkg` and pushes it to the symbol
      # server; no separate symbol handling exists here.
      - name: Pack + push every public-surface SDK package to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          # Phase 182 — turn on per-package CycloneDX SBOM emission on the
          # release path (default-off elsewhere, GP 11/13). SBOMs land in
          # ./artifacts/ alongside the nupkgs; the push loop filters to
          # *.nupkg, so the .cdx.json files are never pushed to the feed.
          TOOLUP_EMIT_SBOM: "true"
        run: dotnet run --project Build.fsproj -- Publish

      # Phase 182 — signed build-provenance attestation for every pushed
      # package. Binds each artefact's SHA-256 digest to this workflow run
      # (source commit + build environment) via an in-toto provenance
      # statement signed through Sigstore. A consumer verifies with
      # `gh attestation verify <nupkg> --repo ToolUp-Forge/toolup-forge`.
      # Runs after the push so a publish failure never produces a dangling
      # attestation; the nupkgs persist in ./artifacts/ from the step above.
      - name: Attest build provenance for published packages
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "artifacts/*.nupkg"

      # Phase 182 — retain the per-package SBOMs as a downloadable run
      # artefact (GitHub Packages NuGet has no SBOM slot). `warn` rather
      # than `error` so a manual re-run that skips every duplicate (no new
      # SBOMs) doesn't fail the job.
      - name: Upload SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: "artifacts/*.cdx.json"
          if-no-files-found: warn

  # ─── Phase 184 — the fresh-machine smoke gate ────────────────────────
  #
  # "A fresh machine can `dotnet add package` the SDK and build it" was a
  # Wave-5.5 exit criterion, run ONCE by hand. Nothing re-ran it after any
  # later tag. Every gate in `checks.yml` proves something about the TREE;
  # a nupkg is a different artefact, and the classes that live only in it
  # — a transitive dependency a same-repo project reference silently
  # supplied, a `fable/`-packed source path that stops extracting —
  # surface first in a consumer's `dotnet add package`, not in CI.
  #
  # It restores from nuget.org ANONYMOUSLY, which is also what makes it
  # honest: no credential, no local feed, exactly the path an external
  # adopter takes. It publishes nothing.
  #
  # ── `needs: publish`, and the wait that follows ─────────────────────
  #
  # A push is ACCEPTED before it is INDEXED. Probing the moment the push
  # returns records a false red about a release that is fine (the Phase
  # 255 lesson), so the target polls the flat-container index for the
  # version and only then scaffolds. `needs:` orders the two jobs; the
  # poll absorbs the minutes between.
  #
  # ── Why the job is three lines ──────────────────────────────────────
  #
  # The `VerifyFable` precedent recorded twice in `checks.yml`: the target
  # owns the whole mechanism, so CI and a developer necessarily run the
  # same thing. Here it also protects the gate's one load-bearing
  # property — the probe is scaffolded OUTSIDE the checkout, because
  # nuget.config files merge up the directory tree and MSBuild walks
  # Directory.Build.props upward, so a probe under the repo would resolve
  # through forge's own sources and go GREEN over a release no consumer
  # can restore. Inlining `dotnet add package` as steps here would lose
  # that silently, which is why `PublishedSmoke.smokeJobFindings` lints
  # this job for it from the Build test pack on every push.
  #
  # ── It is NOT a branch-protection required check, and cannot be ─────
  #
  # Phase 184 was briefed to add one. Branch protection gates pushes and PRs to a
  # BRANCH; this job runs on a `v*.*.*` TAG push, so it never reports a
  # status GitHub could require on `main`. Adding it to CONTRIBUTING's
  # required-check list would block every PR forever on a check that
  # never arrives — the exact hazard that section already warns about for
  # a renamed job. What enforcement there is, is here: a red probe is a
  # red release run, on the tag, with the packages already pushed and
  # therefore immutable. The remedy for a red is a new patch version, and
  # the gate's value is that it is CI saying so rather than an adopter.
  #
  # ── Cost ────────────────────────────────────────────────────────────
  #
  # Off the critical path by construction — a separate job that only the
  # publish path reaches, so day-to-day PR builds pay nothing (GP 13).
  # The `timeout-minutes` sits above the target's own 20-minute index
  # budget so a slow index fails with the target's message (which names
  # both readings) rather than as a bare job timeout.
  published-package-smoke:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Same CI workaround as every other job here: the dev-machine local
      # feed at ../../local-nuget-feed does not exist on the runner. This
      # is for the CHECKOUT's own restore of Build.fsproj — the probe
      # itself is scaffolded outside the repo with a `<clear />`d
      # nuget.config, so this source can never reach it.
      - name: Create empty local-feed dir (CI workaround)
        run: mkdir -p ../../local-nuget-feed

      # The version is read off ${{ github.ref }} inside the target, so no
      # copy of the number lives here to drift from the tag that was just
      # published.
      - name: Restore and compile the published packages on a clean path (VerifyPublishedPackages)
        run: dotnet run --project Build.fsproj -- VerifyPublishedPackages
