# Publish every public-surface SDK package on a release tag. Two lanes:
# nuget.org (the anonymous-restore front door — Phase 346, 2026-08-19)
# and the toolup-forge GitHub Packages NuGet feed (the original Phase
# 11.C.3 cloud-publish path, 2026-05-28, retained as secondary/failover).
#
# ─── Trigger ─────────────────────────────────────────────────────────
#
# - `v*.*.*` tag push — coordinated SDK-wide release. Every IsPackable
#   fsproj packs at its current <Version> — the centralised <Version> in
#   Directory.Build.props, unless a per-fsproj <Version> override applies.
#   NOTE: <Version> (what packs + publishes here) is a SEPARATE knob from
#   the meta-manifest's <ToolUpSdkVersion> in Directory.Packages.props
#   (the version at which a *consumer* pins every ToolUp.* package via the
#   ToolUp.Sdk meta-manifest). The two are maintained independently and
#   are NOT auto-derived from each other — keep them in sync at release
#   time. Per-package independent bumps remain possible via a per-fsproj
#   <Version> override; the tag scheme `v{Package}/{Version}` is reserved
#   for that future shape but not yet wired here.
# - `workflow_dispatch` — manual trigger for the first publish + any
#   re-run after a transient CI failure. Idempotent thanks to
#   `--skip-duplicate` in the FAKE Publish target — re-runs cleanly skip
#   versions already pushed.
#
# ─── Authentication ──────────────────────────────────────────────────
#
# GitHub Packages lane: the Actions-provided `GITHUB_TOKEN` is the
# publish credential. The `permissions: packages: write` declaration
# below grants it the right scope automatically; no PAT is needed for
# CI. A PAT with `write:packages` is only required for local manual
# publishes (set as `GITHUB_PACKAGES_TOKEN` in the developer's
# environment).
#
# nuget.org lane (Phase 346): pushes the same `./artifacts/` set with
# the `NUGET_API_KEY` repo secret — an api.nuget.org API key scoped to
# push on the `ToolUp.*` glob. The step is guarded on the secret being
# present, so a fork or a checkout without the secret runs the GH
# Packages lane exactly as before and skips nuget.org (GP 11). nuget.org
# is the OSS front door because GH Packages requires an authenticated
# token for NuGet restore even on public packages. Keys expire (365-day
# max) — rotation is an operator act on nuget.org + the repo secret.
#
# ─── Acceptance criteria (Phase 11.C.3) ──────────────────────────────
#
# After the first successful run on tag v0.3.0:
# - Every package + `ToolUp.Sdk` meta-manifest appears under
#   https://github.com/orgs/ToolUp-Forge/packages at version 0.3.0.
# - A fresh checkout can `dotnet add package
#   ToolUp.Platform.Core --version 0.3.0` from the cloud feed (with a
#   `read:packages` PAT while the feed is private; no auth once the
#   feed flips public).
# - Consumers adopt the cloud source in a follow-up PR.

name: publish-nuget

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  # Phase 182 — build-provenance attestation. `attest-build-provenance`
  # mints a signed attestation (in-toto provenance) per published nupkg;
  # it needs `id-token: write` (OIDC for the Sigstore signing identity)
  # and `attestations: write` (to record the attestation against the repo).
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Workaround for NU1301 on a fresh CI checkout: the repo's
      # `nuget.config` declares a `local` source at `..\..\local-nuget-feed`
      # for dev-machine cross-repo iteration. That folder exists on the
      # workspace root locally but not on the runner; NuGet treats the
      # missing path as a hard error during restore. Creating an empty
      # dir lets NuGet enumerate it (0 packages) and proceed to
      # `nuget.org` for external deps. No effect on the published nupkgs.
      - name: Create empty local-feed dir (CI workaround)
        run: mkdir -p ../../local-nuget-feed

      - name: Pack + push every public-surface SDK package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Phase 182 — turn on per-package CycloneDX SBOM emission on the
          # release path (default-off elsewhere, GP 11/13). SBOMs land in
          # ./artifacts/ alongside the nupkgs; the push step filters to
          # *.nupkg, so the .cdx.json files are never pushed to the feed.
          TOOLUP_EMIT_SBOM: "true"
        run: dotnet run --project Build.fsproj -- Publish

      # Phase 346 — nuget.org publication lane. Pushes the same artifact
      # set the GH Packages lane just packed, so the two feeds carry
      # byte-identical nupkgs for every version. `--skip-duplicate` keeps
      # re-runs idempotent (nuget.org versions are immutable). The
      # `*.nupkg` glob does not match `.snupkg` — but `dotnet nuget push`
      # auto-detects a matching `.snupkg` beside each `.nupkg` and pushes
      # it to nuget.org's symbol server, the symbol lane GH Packages
      # cannot accept. Guarded on the secret: absent `NUGET_API_KEY`,
      # the step skips and the workflow behaves exactly as pre-346.
      - name: Push to nuget.org
        if: ${{ secrets.NUGET_API_KEY != '' }}
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key "$NUGET_API_KEY"
          --skip-duplicate

      # Phase 182 — signed build-provenance attestation for every pushed
      # package. Binds each artefact's SHA-256 digest to this workflow run
      # (source commit + build environment) via an in-toto provenance
      # statement signed through Sigstore. A consumer verifies with
      # `gh attestation verify <nupkg> --repo ToolUp-Forge/toolup-forge`.
      # Runs after the push so a publish failure never produces a dangling
      # attestation; the nupkgs persist in ./artifacts/ from the step above.
      - name: Attest build provenance for published packages
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "artifacts/*.nupkg"

      # Phase 182 — retain the per-package SBOMs as a downloadable run
      # artefact (GitHub Packages NuGet has no SBOM slot). `warn` rather
      # than `error` so a manual re-run that skips every duplicate (no new
      # SBOMs) doesn't fail the job.
      - name: Upload SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: "artifacts/*.cdx.json"
          if-no-files-found: warn
